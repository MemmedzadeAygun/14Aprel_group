spring.application.name=user-service

server.port=8002

spring.config.import=configserver:http://localhost:8888

# Circuit Breaker
resilience4j.circuitbreaker.instances.bookService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.bookService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.bookService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bookService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.bookService.permittedNumberOfCallsInHalfOpenState=2

# Retry
resilience4j.retry.instances.bookService.maxAttempts=3
resilience4j.retry.instances.bookService.waitDuration=2s